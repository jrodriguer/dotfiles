name: {{PROJECT_NAME}}
options:
  minimumXcodeGenVersion: 2.44.1
settings:
  base:
    SWIFT_VERSION: 6.2
packages: {}
targets:
  {{PROJECT_NAME}}:
    type: application
    platform: {{PLATFORM_TARGET}}
    deploymentTarget: "{{DEPLOYMENT_TARGET}}"
    sources:
      - path: {{PROJECT_NAME}}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: []
